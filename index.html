<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VIRA404 — Official domain of Vira L.</title>
  <meta name="description" content="VIRA404 is the official domain of Vira L., NoCodeGirl. Alternative rock, cyberpunk pop and Russian digital rock.">
  <meta name="robots" content="index, follow">

  <meta property="og:title" content="VIRA404 — Official domain of Vira L.">
  <meta property="og:description" content="NoCodeGirl is Vira L. Alternative rock, cyberpunk pop and Russian digital rock.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://vira404.com">

  <style>
    :root {
      --bg: #050709;
      --fg: #e8f8ff;
      --muted: #9fb3ba;
      --line: #233940;
      --cyan: #5ff3ff;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(
          rgba(5, 7, 9, 0.42),
          rgba(5, 7, 9, 0.86)
        ),
        url("assets/vira-bg.jpg") center center / cover no-repeat;
      color: var(--fg);
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    main {
      width: min(820px, 92vw);
      padding: 48px 20px 56px;
    }

    .tag {
      color: var(--cyan);
      letter-spacing: 0.18em;
      font-size: 13px;
      text-transform: uppercase;
      margin-bottom: 22px;
    }

    h1 {
      font-size: clamp(54px, 12vw, 118px);
      line-height: 0.88;
      margin: 0 0 26px;
      letter-spacing: -0.06em;
    }

    p {
      font-size: clamp(18px, 2.5vw, 24px);
      line-height: 1.45;
      color: var(--muted);
      max-width: 720px;
      margin: 0;
    }

    strong {
      color: var(--fg);
      font-weight: 700;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 36px;
    }

    a {
      color: var(--fg);
      text-decoration: none;
      border: 1px solid var(--line);
      padding: 12px 16px;
      border-radius: 999px;
      transition: border-color 0.15s ease, transform 0.15s ease;
      background: rgba(5, 7, 9, 0.38);
      backdrop-filter: blur(6px);
    }

    a:hover {
      border-color: var(--cyan);
      transform: translateY(-1px);
    }

    .footer {
      margin-top: 48px;
      font-size: 13px;
      color: #6f858c;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    @media (min-width: 800px) {
      body {
        background:
          linear-gradient(
            90deg,
            rgba(5, 7, 9, 0.92),
            rgba(5, 7, 9, 0.42),
            rgba(5, 7, 9, 0.74)
          ),
          url("assets/vira-bg.jpg") center center / cover no-repeat;
        align-items: center;
        justify-content: flex-start;
      }

      main {
        margin-left: 6vw;
        padding: 64px 24px;
      }
    }
  </style>
</head>

<body>
  <main>
    <div class="tag">Official domain</div>

    <h1>VIRA404</h1>

    <p>
      <strong>NoCodeGirl is Vira L.</strong><br>
      Alternative rock, cyberpunk pop and Russian digital rock from the edge of the system.
    </p>

    <div class="links">
      <a href="https://www.instagram.com/vira_l.music/">Instagram</a>
      <a href="https://www.youtube.com/@vira_l_music">YouTube</a>
    </div>

    <div class="footer">
      Vira L. / NoCodeGirl / VIRA404
    </div>
  </main>
</body>
</html>
