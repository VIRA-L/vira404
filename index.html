    <meta name="twitter:image" content="https://vira404.com/assets/vira-l-nocodegirl-vira404-official.webp">

    <link rel="stylesheet" href="vira404-dark-alt-pop-style.css">
    <link rel="icon" type="image/png" sizes="96x96" href="assets/nocodegirl-thumbdown-emblem.png">
    <link rel="shortcut icon" type="image/png" sizes="48x48" href="assets/nocodegirl-thumbdown-emblem.png">

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "MusicGroup",
  "@id": "https://vira404.com/#nocodegirl",
  "name": "Vira L.",
  "alternateName": "NoCodeGirl",
  "url": "https://vira404.com/",
  "image": "https://vira404.com/assets/vira-l-nocodegirl-vira404-official.webp",
  "logo": "https://vira404.com/assets/nocodegirl-thumbdown-emblem.png",
  "description": "Official alternative metal, dark pop and Russian post-hardcore music project by Vira L. (NoCodeGirl).",
  "genre": ["Alternative Metal", "Dark Pop", "Digital Rock", "Cyberpunk", "Post-Hardcore"],
  "sameAs": [
    "https://www.youtube.com/@vira_l_music",
    "https://www.instagram.com/vira_l.music/",
    "https://suno.com/voice/3da34a18-171b-48c1-9cb7-28fd0a1ca62a"
  ],
  "album": [
    { "@type": "MusicAlbum", "name": "CTRL-ALT-ME" },
    { "@type": "MusicAlbum", "name": "VIRA:L" },
    { "@type": "MusicAlbum", "name": "Пропаганда" }
  ],
  "track": [
    { "@type": "MusicRecording", "name": "No Code" },
    { "@type": "MusicRecording", "name": "CTRL-X" },
    { "@type": "MusicRecording", "name": "Ghost in teh Prompt" },
    { "@type": "MusicRecording", "name": "Не гаси" }
  ]  
}
</script>
</head>

<body>

    <!-- Conteneur global des 4 pavés -->
    <main class="grid-container">

        <!-- PAVÉ 1 : Module Libre (Landing / Config) -->
        <section class="pave pave-1" id="pave-landing">
            <div class="artwork-box" id="landing-artwork-container">
                <img id="landing-cover-img" src="" 
                     alt="Portrait of red-haired female singer Vira L. (NoCodeGirl), alternative digital rock artist in leather jacket, VIRA404 Official" class="bg-artwork-img"
                     width="480"
                     height="1080"
                     loading="eager"
                     fetchpriority="high"
                     style="width: 100%; height: 100%; object-fit: cover;">
            </div>
            <div class="pave-content">
                <div class="pave-header">
                    <!-- Switch de langue (EN actif par défaut) -->
                    <div class="lang-switch">
                        <button id="btn-lang-en" class="btn-lang active">EN</button>
                        <span>|</span>
                        <button id="btn-lang-ru" class="btn-lang">RU</button>
                    </div>
                    <h2 id="landing-title"></h2>
                    <p id="landing-subtitle"></p>
                    <p id="landing-caption1"></p>
                    <p id="landing-caption2"></p>
                    <p id="landing-caption3"></p>
<h1>
    <img src="assets/vira-l-official-red-signature.webp" 
         alt="Vira L. (NoCodeGirl)" 
         width="250" 
         height="134" 
         loading="eager"
         style="width: 120px; height: auto; display: block;">
</h1>
                </div>
                <div class="pave-footer" id="landing-links"></div>
            </div>
        </section>

        <!-- PAVÉ 2 : Live Radio -->
<section class="pave pave-2" id="pave-radio">
    <div class="pave-content">
        <!-- Calque du mini-jeu spécifique au Pavé 2 -->
        <div id="retro-game-layer">
            <div id="retro-paddle"></div>
        </div>

        <!-- 1. Le Header en haut -->
        <div class="pave-header">
            <h2 id="radio-title-header">LIVE RADIO</h2>
        </div>

        <!-- 2. Le conteneur de paroles au milieu -->
        <div id="radio-lyrics-container" class="radio-lyrics">---</div>
        <a id="radio-download-btn" style="display:none;" href="" download></a>

        <!-- 3. Le footer en bas -->
        <div class="pave-footer">
            <div class="radio-meta-grid">
                <div class="radio-meta-left">
                    <h4 id="radio-track-title"></h4>
                    <p id="radio-track-info"></p>
                </div>
                <div class="radio-meta-right">
                    <p id="radio-album-name"></p>
                </div>
            </div>

            <div class="radio-controls-row">
                <img id="radio-cover-img" class="radio-cover-thumb" src="" alt="Viral radio live stream track cover and dark aesthetics, copper-haired singer" />
                <button id="radio-toggle-btn" class="btn-ctrl" aria-label="Play or pause radio stream"><span style="margin-left: 4px;">▶</span></button>
                <img id="radio-album-img" class="radio-cover-thumb" src="" alt="Official VIRA404 music player artwork, NoCodeGirl thumbdown emblem or album cover." />
            </div>
        </div>

        <audio id="radio-audio" preload="none"></audio>
    </div>
</section>

        <!-- PAVÉ 3 : Featured Drop -->
        <section class="pave pave-3" id="pave-featured">
            <div class="pave-content">
                <div class="pave-header">
                    <h2 id="featured-title-header">FEATURED</h2>
                    <p id="featured-date" class="featured-date"></p>
                    <p id="featured-caption"></p>
                </div>

                <div class="artwork-box" id="featured-artwork-container">
                    <img id="featured-cover-img" src="" alt="Dark alt-rock cover artwork capturing the rebellious vibe of Vira L.'s latest single drop." class="bg-artwork-img">
               </div>

                <div class="pave-footer">
                    <h4 id="featured-track-title"></h4>
                    <div class="custom-parser-controls">
                        <button id="feat-rewind" class="btn-mini" title="Rewind">⏮</button>
                        <button id="feat-play" class="btn-mini" title="Play / Pause">▶</button>
                        <button id="feat-forward" class="btn-mini" title="Forward">⏭</button>
                        <button id="feat-loop" class="btn-mini" title="Loop">↻</button>
                        <input type="range" id="feat-seek" value="0" max="100" title="Position">
                        <input type="range" id="feat-volume" min="0" max="1" step="0.01" value="0.8" title="Volume">
                    </div>
                </div>

                <audio id="featured-audio" preload="metadata"></audio>
            </div>
        </section>

        <!-- PAVÉ 4 : Working / Next Drop -->
        <section class="pave pave-4" id="pave-working">
            <div class="pave-content">
                <div class="pave-header">
                    <h2>WORKING</h2>
                    <h4 id="working-title"></h4>
                    <p id="working-caption1"></p>
                    <p id="working-caption2"></p>
                </div>

                <div class="artwork-box" id="working-artwork-container">
                    <img id="working-cover-img" src="" alt="Music cover art, featuring the young copper-haired female singer NoCodeGirl." class="bg-artwork-img">
                </div>

                <div class="pave-footer">
                    <div id="countdown-timer">00j 00h 00m 00s</div>
                </div>
            </div>
        </section>

    </main>

    <script src="vira404-dark-alt-pop-script.js"></script>
</body>
</html>
