<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VIRA404 — Official domain of Vira L.</title>
  <meta name="description" content="VIRA404 is the official domain of Vira L., NoCodeGirl. Alternative rock, cyberpunk pop and Russian digital rock.">
  <meta name="robots" content="index, follow">

  <meta property="og:title" content="VIRA404 — Official domain of Vira L.">
  <meta property="og:description" content="NoCodeGirl is Vira L. Alternative rock, cyberpunk pop and Russian digital rock.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://vira404.com">

  <style>
    :root {
      --bg: #050709;
      --fg: #e8f8ff;
      --muted: #9fb3ba;
      --line: #233940;
      --cyan: #5ff3ff;
      --violet: #b56cff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 20% 10%, rgba(95, 243, 255, 0.12), transparent 32%),
        radial-gradient(circle at 80% 80%, rgba(181, 108, 255, 0.12), transparent 30%),
        var(--bg);
      color: var(--fg);
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    main {
      width: min(820px, 90vw);
      padding: 56px 24px;
    }

    .tag {
      color: var(--cyan);
      letter-spacing: 0.18em;
      font-size: 13px;
      text-transform: uppercase;
      margin-bottom: 22px;
    }

    h1 {
      font-size: clamp(54px, 12vw, 118px);
      line-height: 0.88;
      margin: 0 0 26px;
      letter-spacing: -0.06em;
    }

    p {
      font-size: clamp(18px, 2.5vw, 24px);
      line-height: 1.45;
      color: var(--muted);
      max-width: 720px;
      margin: 0;
    }

    strong {
      color: var(--fg);
      font-weight: 700;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 36px;
    }

    a {
      color: var(--fg);
      text-decoration: none;
      border: 1px solid var(--line);
      padding: 12px 16px;
      border-radius: 999px;
      transition: border-color 0.15s ease, transform 0.15s ease;
    }

    a:hover {
      border-color: var(--cyan);
      transform: translateY(-1px);
    }

    .footer {
      margin-top: 48px;
      font-size: 13px;
      color: #6f858c;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
  </style>
</head>

<body>
  <main>
    <div class="tag">Official domain</div>

    <h1>VIRA404</h1>

    <p>
      <strong>NoCodeGirl is Vira L.</strong><br>
      Alternative rock, cyberpunk pop and Russian digital rock from the edge of the system.
    </p>

    <div class="links">
      <a href="https://www.instagram.com/vira_l.music/">Instagram</a>
      <a href="#">Listen</a>
      <a href="#">Support</a>
      <a href="#">Amazon</a>
    </div>

    <div class="footer">
      Vira L. / NoCodeGirl / VIRA404
    </div>
  </main>
</body>
</html>
