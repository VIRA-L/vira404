<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vira L. — Landing Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Conteneur global des 4 pavés -->
    <main class="grid-container">

        <!-- PAVÉ 1 : Module Libre (Landing / Config) -->
        <section class="pave pave-1" id="pave-landing">
            <div class="pave-content">
                <div class="pave-header">
                    <!-- Switch de langue (EN actif par défaut) -->
                    <div class="lang-switch">
                        <button id="btn-lang-en" class="btn-lang active">EN</button>
                        <span>|</span>
                        <button id="btn-lang-ru" class="btn-lang">RU</button>
                    </div>
                    <h2 id="landing-title"></h2>
                    <p id="landing-subtitle"></p>
                    <p id="landing-caption1"></p>
                    <p id="landing-caption2"></p>
                    <p id="landing-caption3"></p>
                </div>
                <div class="pave-footer" id="landing-links"></div>
            </div>
        </section>

        <!-- PAVÉ 2 : Live Radio -->
<section class="pave pave-2" id="pave-radio">
    <div class="pave-content">
        <!-- Calque du mini-jeu spécifique au Pavé 2 -->
        <div id="retro-game-layer">
            <div id="retro-paddle"></div>
        </div>

        <!-- 1. Le Header en haut -->
        <div class="pave-header">
            <h3 id="radio-title-header">LIVE RADIO</h3>
            <span id="radio-badge" class="live-badge is-off">OFF AIR</span>
        </div>

        <!-- 2. Le conteneur de paroles au milieu -->
        <div id="radio-lyrics-container" class="radio-lyrics">---</div>
        <a id="radio-download-btn" style="display:none;" href="" download></a>

        <!-- 3. Le footer en bas -->
        <div class="pave-footer">
            <div class="radio-meta-grid">
                <div class="radio-meta-left">
                    <h4 id="radio-track-title"></h4>
                    <p id="radio-track-info"></p>
                </div>
                <div class="radio-meta-right">
                    <p id="radio-album-name"></p>
                </div>
            </div>

            <div class="radio-controls-row">
                <img id="radio-cover-img" class="radio-cover-thumb" src="" alt="Cover Morceau" />
                <button id="radio-toggle-btn" class="btn-ctrl" title="Lecture / Pause"><span style="margin-left: 4px;">▶</span></button>
                <img id="radio-album-img" class="radio-cover-thumb" src="" alt="Cover Album" />
            </div>
        </div>

        <audio id="radio-audio" preload="none"></audio>
    </div>
</section>

        <!-- PAVÉ 3 : Featured Drop -->
        <section class="pave pave-3" id="pave-featured">
            <div class="pave-content">
                <div class="pave-header">
                    <h3 id="featured-title-header">FEATURED</h3>
                    <p id="featured-date" class="featured-date"></p>
                    <p id="featured-caption"></p>
                </div>

                <div class="artwork-box" id="featured-artwork-container"></div>

                <div class="pave-footer">
                    <h4 id="featured-track-title"></h4>
                    <div class="custom-parser-controls">
                        <button id="feat-rewind" class="btn-mini" title="Reculer 10s">⏮</button>
                        <button id="feat-play" class="btn-mini" title="Lecture / Pause">▶</button>
                        <button id="feat-forward" class="btn-mini" title="Avancer 10s">⏭</button>
                        <button id="feat-loop" class="btn-mini" title="Lecture en boucle">↻</button>
                        <input type="range" id="feat-seek" value="0" max="100" title="Position">
                        <input type="range" id="feat-volume" min="0" max="1" step="0.01" value="0.8" title="Volume">
                    </div>
                </div>

                <audio id="featured-audio" preload="metadata"></audio>
            </div>
        </section>

        <!-- PAVÉ 4 : Working / Next Drop -->
        <section class="pave pave-4" id="pave-working">
            <div class="pave-content">
                <div class="pave-header">
                    <h3>WORKING</h3>
                    <h4 id="working-title"></h4>
                    <p id="working-caption1"></p>
                    <p id="working-caption2"></p>
                </div>

                <div class="artwork-box" id="working-artwork-container"></div>

                <div class="pave-footer">
                    <div id="countdown-timer">00j 00h 00m 00s</div>
                </div>
            </div>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
